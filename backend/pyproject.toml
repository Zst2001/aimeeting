[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-meeting-minutes-backend"
version = "0.1.0"
description = "Phase 1 Task 1 backend foundation for AI Meeting Minutes"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13,<2",
    "argon2-cffi>=23.1,<26",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "PyJWT[crypto]>=2.10,<3",
    "pymysql>=1.1,<2",
    "redis>=5.0,<6",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
