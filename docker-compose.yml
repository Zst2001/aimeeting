name: ai-meeting-minutes

services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_DATABASE: ${DATABASE_NAME:-meeting_minutes}
      MYSQL_USER: ${DATABASE_USER:-meeting_user}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:-meeting_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_me_root}
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
    environment:
      APP_NAME: ${APP_NAME:-AI Meeting Minutes}
      APP_ENV: ${APP_ENV:-development}
      DEBUG: ${DEBUG:-true}
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
      DATABASE_HOST: mysql
      DATABASE_PORT: 3306
      DATABASE_NAME: ${DATABASE_NAME:-meeting_minutes}
      DATABASE_USER: ${DATABASE_USER:-meeting_user}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-meeting_password}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_BACKEND_PROXY_TARGET: http://backend:8000
    depends_on:
      backend:
        condition: service_started
    ports:
      - "5173:5173"

volumes:
  mysql_data:
